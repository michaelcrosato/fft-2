<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07060a" />
<title>Audio Workshop — Final Fealty Tactics</title>
<style>
  :root {
    --bg: #0b0a0e; --panel: #15121a; --panel2: #1d1924; --ink: #e9dfc7; --muted: #a79a80;
    --gold: #c9a24a; --gold2: #e6c878; --line: #3a3140; --red: #b5523b; --green: #6f9a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 'EB Garamond', Georgia, serif; }
  body { padding: 18px 16px 60px; max-width: 1180px; margin: 0 auto; }
  h1 { font-family: Cinzel, Georgia, serif; font-weight: 600; letter-spacing: 0.08em; color: var(--gold2); margin: 4px 0 2px; font-size: 26px; }
  h2 { font-family: Cinzel, Georgia, serif; font-weight: 500; letter-spacing: 0.06em; color: var(--gold); font-size: 17px; margin: 26px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .banner { background: #2b2014; border: 1px solid #6b5327; color: var(--gold2); padding: 10px 14px; border-radius: 8px; margin: 10px 0 4px; cursor: pointer; }
  .banner.ok { background: #16211a; border-color: #3f6246; color: #b9dbb0; cursor: default; }
  .now { position: sticky; top: 0; z-index: 5; background: rgba(11,10,14,0.94); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
  .now .t { font-family: Cinzel, Georgia, serif; font-size: 17px; color: var(--gold2); }
  .now .meta { color: var(--muted); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; grid-column: 1 / -1; position: relative; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); width: 0; }
  .bar b { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff8; }
  canvas.meter { width: 100%; height: 38px; grid-column: 1 / -1; background: var(--panel); border-radius: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  input[type=range] { accent-color: var(--gold); width: 130px; }
  button { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: #3a2c14; border-color: #7a5c25; color: var(--gold2); }
  button.stop { background: #2d1512; border-color: #6d2e24; }
  .tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .card:hover { border-color: var(--gold); }
  .card.on { border-color: var(--gold2); background: #211b12; }
  .card .id { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--gold); }
  .card .name { font-family: Cinzel, Georgia, serif; font-size: 14px; margin: 2px 0; }
  .card .d { color: var(--muted); font-size: 13px; }
  .card .len { float: right; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); }
  .sfx { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
  .sfx button { font: 13px ui-monospace, Menlo, Consolas, monospace; padding: 7px 6px; }
  .note { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { .now { grid-template-columns: 1fr; } input[type=range] { width: 100px; } }
</style>
</head>
<body>
  <h1>Audio Workshop</h1>
  <p class="sub">Every note and sound here is synthesized live with the Web Audio API. Audition the score and the effects.</p>
  <div class="banner" id="unlock">Click anywhere to wake the orchestra.</div>

  <div class="now">
    <div>
      <div class="t" id="nowTitle">Silence</div>
      <div class="meta" id="nowMeta">—</div>
    </div>
    <div class="row">
      <label>fade <input type="range" id="fade" min="0" max="4" step="0.1" value="1" /><span id="fadeV">1.0s</span></label>
      <button class="stop" id="stop">Stop</button>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i><b id="barLoop"></b></div>
    <canvas class="meter" id="meter" width="1100" height="76"></canvas>
  </div>

  <h2>Mixer</h2>
  <div class="row">
    <label>master <input type="range" id="vMaster" min="0" max="1" step="0.01" /></label>
    <label>music <input type="range" id="vMusic" min="0" max="1" step="0.01" /></label>
    <label>sfx <input type="range" id="vSfx" min="0" max="1" step="0.01" /></label>
    <button id="duck">Duck music 70% for 2 s</button>
  </div>

  <h2>Score</h2>
  <div class="tracks" id="tracks"></div>

  <h2>Sound effects</h2>
  <div class="row" style="margin-bottom:10px">
    <label>pitch <input type="range" id="pitch" min="0.5" max="2" step="0.01" value="1" /><span id="pitchV">1.00</span></label>
    <label>pan <input type="range" id="pan" min="-1" max="1" step="0.05" value="0" /><span id="panV">0.00</span></label>
    <label>volume <input type="range" id="svol" min="0" max="1.5" step="0.05" value="1" /></label>
    <button id="blips">Text blips</button>
    <button id="storm">SFX storm (voice limit)</button>
  </div>
  <div class="sfx" id="sfx"></div>
  <p class="note">Unknown ids fall back to a generic blip. <code>pitch</code> is a frequency multiplier.</p>

  <script type="module" src="./src/audio/audio-test.ts"></script>
</body>
</html>
